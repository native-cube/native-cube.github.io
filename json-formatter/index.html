<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=https://native-cube.com/yaml-formatter/" />
    <link
      rel="canonical"
      href="https://native-cube.com/yaml-formatter/"
    />
    <title>Redirecting to YAML &amp; JSON Formatter | Native Cube</title>
    <script>
      if (window.location.hash) {
        const destination = new URL(document.querySelector('link[rel="canonical"]').href);
        destination.hash = window.location.hash;
        window.location.replace(destination);
      }
    </script>
  </head>
  <body>
    <p>
      Redirecting to the
      <a href="https://native-cube.com/yaml-formatter/">YAML &amp; JSON Formatter</a>.
    </p>
  </body>
</html>
